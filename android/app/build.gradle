apply plugin: 'com.android.application'

android {
    namespace = "com.eggli.flashcards"
    compileSdk 36
    defaultConfig {
        applicationId "com.eggli.flashcards"
        minSdkVersion 26
        targetSdkVersion 36
        versionCode 2
        versionName "2.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
            // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
            // 禁用 PNG crunching，避免 AAPT2 daemon 在 Windows 上处理 PNG 时失败
            cruncherEnabled = false
        }
    }
    buildFeatures {
        buildConfig true
    }
    packaging {
        resources {
            excludes += ['META-INF/AL2.0', 'META-INF/LGPL2.1']
        }
    }

    // 读取 keystore.properties（位于 ~/.gradle/ 或项目根目录）
    // 修复 H5：避免签名密码硬编码在源码中
    def keystorePropertiesFile = rootProject.file("keystore.properties")
    def keystoreProperties = new Properties()
    try {
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    } catch (Exception ignored) {
        // 文件不存在时使用环境变量兜底（CI/CD 场景）
        keystoreProperties.setProperty("storeFile", System.getenv("RELEASE_STORE_FILE") ?: "../test-release.keystore")
        keystoreProperties.setProperty("storePassword", System.getenv("RELEASE_STORE_PASSWORD") ?: "")
        keystoreProperties.setProperty("keyAlias", System.getenv("RELEASE_KEY_ALIAS") ?: "test-key")
        keystoreProperties.setProperty("keyPassword", System.getenv("RELEASE_KEY_PASSWORD") ?: "")
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'] ?: '../test-release.keystore')
            storePassword keystoreProperties['storePassword'] ?: ''
            keyAlias keystoreProperties['keyAlias'] ?: 'test-key'
            keyPassword keystoreProperties['keyPassword'] ?: ''
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles file('proguard-rules.pro')
            signingConfig signingConfigs.release
        }
    }
    lint {
        // 忽略 Capacitor 插件内置 JS bundle 中的 lint 警告（来自 @capacitor/filesystem 等插件的打包 JS）
        checkReleaseBuilds false
        abortOnError false
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
    implementation('com.alphacephei:vosk-android:0.3.45') {
        exclude group: 'net.java.dev.jna'
    }
    implementation 'net.java.dev.jna:jna:5.13.0@aar'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation files('libs/libtailscale.aar')
    implementation "androidx.security:security-crypto:1.1.0-alpha06"
    
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work", e)
}

// 绕过 AGP 9.2.1 在 Windows 上 stableIds.txt 损坏的问题
// 使用反射移除 processReleaseResources 任务的 stableIdsFile 输入
afterEvaluate {
    tasks.matching { it.name.contains('processReleaseResources') || it.name.contains('processDebugResources') }.all { task ->
        try {
            def stableIdsFileField = task.class.getDeclaredFields().find { it.name.contains('stableIds') || it.name.contains('StableIds') }
            if (stableIdsFileField) {
                stableIdsFileField.setAccessible(true)
                stableIdsFileField.set(task, null)
            }
        } catch (Exception e) {
            // 如果反射失败，尝试删除 stableIds.txt 文件
            try {
                def stableIdsFile = file("${buildDir}/intermediates/stable_resource_ids_file/${task.name.replace('process', '').toLowerCase()}/${task.name}/stableIds.txt")
                if (stableIdsFile.exists()) {
                    stableIdsFile.delete()
                }
            } catch (Exception ignored) { }
        }
    }
}
