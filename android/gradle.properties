# Project-wide Gradle settings.

# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.

# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# The setting is particularly useful for tweaking memory settings.
# -Djava.io.tmpdir 强制使用一个纯 ASCII 路径的临时目录，避免 Windows Defender 拦截 aapt2 daemon 的 IPC 管道
# 注意：Java properties 中 Windows 路径必须使用正斜杠 / 或双反斜杠 \\
org.gradle.jvmargs=-Xmx4096m -Djava.net.preferIPv6Addresses=false -Djava.io.tmpdir=C:/Users/21142/.gradle/tmp

# Use Gradle daemon (always on in modern Gradle, explicit for clarity)
org.gradle.daemon=true

# When configured, Gradle will run in incubating parallel mode.
# This option should only be used with decoupled projects. More details, visit
# http://www.gradle.org/docs/current/userguide/multi_project_builds.html#sec:decoupled_projects
# org.gradle.parallel=true

# AndroidX package structure to make it clearer which packages are bundled with the
# Android operating system, and which are packaged with your app's APK
# https://developer.android.com/topic/libraries/support-library/androidx-rn
android.useAndroidX=true

# AGP 8.x: 使用 builtInKotlin=true（默认），AGP 自动管理 kotlin-android
android.newDsl=false

# Capacitor 插件检测用属性
compileSdkVersion=36
minSdkVersion=26
targetSdkVersion=36
androidxAppCompatVersion=1.7.1
androidxJunitVersion=1.3.0
androidxEspressoCoreVersion=3.7.0
junitVersion=4.13.2
kotlin_version=2.2.21

# Kotlin 编译器策略：禁用独立 Kotlin daemon，使用 Gradle 进程内编译，
# 避免 Windows Defender 锁定 kotlin-daemon 临时文件导致 AccessDeniedException。
kotlin.compiler.execution.strategy=in-process

# AAPT2 daemon 行为控制：完全禁用 daemon，使用进程内 AAPT2
# Windows 下 Defender 拦截 IPC 管道导致 daemon 编译 PNG 失败
android.aapt2DaemonKeepAlive=0
android.aapt2UseDaemon=false

# 禁用 stable resource IDs（Windows 上 AGP 9.2.1 创建 stableIds.txt 时出错）
android.enableStableResourceIds=false
android.nonFinalResIds=true

# JDK 配置：使用 JDK 26（已安装），禁止自动下载
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=false



